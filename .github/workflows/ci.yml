name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================
  # フォーマットチェック
  # ===========================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ===========================================
  # Lint（clippy）
  # ===========================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (buffa-build requires it for codegen)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: clippy-

      # lib / bins / tests / benches / examples を全部同じ厳しさで見る。
      # 以前は --lib だけが -D warnings で、 tests は continue-on-error だった
      # ため、 test / bench / bin の警告が無期限に溜まっていた。
      - name: Run clippy (all targets)
        run: cargo clippy --all-targets --workspace -- -D warnings

  # ===========================================
  # テスト
  # ===========================================
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-

      - name: Set macOS build flags
        if: runner.os == 'macOS'
        run: echo "RUSTFLAGS=-C symbol-mangling-version=v0" >> "$GITHUB_ENV"

      - name: Run tests (lib unit + integration)
        run: cargo test --workspace --verbose

  # ===========================================
  # 依存関係チェック（ライセンス・セキュリティ）
  # ===========================================
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check dependencies
        run: cargo deny check

  # ===========================================
  # MSRV確認
  # ===========================================
  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (buffa-build requires it for codegen)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-

      - name: Check MSRV
        run: cargo check --workspace

  # ===========================================
  # TS SDK 型チェック
  # ===========================================
  ts-typecheck:
    name: TS Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ===========================================
  # Ruby クライアント (magnus native extension)
  # ===========================================
  # ext/unison_client は crates.io の club-unison に依存する gem なので、
  # workspace の変更ではなく **公開済み crate に対して** gem がビルド・動作する
  # ことを見る job。 rb-sys は Ruby ABI を要求するため素の `cargo clippy` は
  # 通らず、 `rake compile` (= rb_sys が Ruby env を注入) が唯一のビルド経路。
  # test/e2e/ は `unison` バイナリが要るので default の `rake test` からは外れ、
  # ここでは走らない。
  ruby:
    name: Ruby Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ruby
    steps:
      - uses: actions/checkout@v4

      # club-unison の build script (buffa-build) が protoc を要求する。
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: clients/ruby

      - name: Compile native extension and run tests
        run: bundle exec rake test

  # ===========================================
  # クロス言語 E2E（TS SDK ↔ Rust server）
  # ===========================================
  # npm test は webtransport_echo_server 例を `cargo run` で spawn するため、
  # Rust toolchain + ビルド済み workspace が必須。
  # E2E 実行前に example を明示ビルドし、cold build による timeout を回避する。
  cross-lang-e2e:
    name: Cross-Language E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (buffa-build requires it for codegen)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: e2e-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      # E2E の `cargo run --example` が cold build にならないよう事前ビルド。
      - name: Build Rust workspace + echo server example
        run: cargo build --workspace --example webtransport_echo_server -p club-unison

      - name: Install TS dependencies
        working-directory: clients/typescript
        run: npm ci

      # webtransport_e2e.test.ts を含む全 TS テストを実行。
      # E2E は build 済み example を spawn して実 WebTransport ラウンドトリップを行う。
      - name: Run TS test suite (incl. cross-lang E2E)
        working-directory: clients/typescript
        run: npm test

  # ===========================================
  # Swift client (clients/swift)
  # ===========================================
  # NWProtocolQUIC / swift-protobuf を使う SPM package。生成 wire コードは
  # コミット済みなので protoc 不要。LiveE2ETests は UNISON_LIVE 環境変数で gate
  # され (mock server 必須)、ここでは未設定なので skip される。
  # Package.swift は repo root (SPM の version 指定 remote 依存が root manifest を
  # 要求するため)、source 実体は clients/swift/ 配下。よって build/test は root で実行。
  swift:
    name: Swift Client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test (live e2e は UNISON_LIVE gate で skip)
        run: swift test
